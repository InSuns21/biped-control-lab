<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-labelledby="title desc">
<title id="title">安定平衡と不安定平衡の比較</title>
<desc id="desc">左はお椀の底のボールが元に戻る安定平衡、右は支点上の倒立振子が傾きと同じ方向へ倒れる不安定平衡を示す。</desc>
<defs>
  <marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" viewBox="0 0 12 12" refX="10" refY="6" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#155eef"/></marker>
  <marker id="dangerArrow" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" viewBox="0 0 12 12" refX="10" refY="6" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#c92a2a"/></marker>
</defs>
<rect width="900" height="360" rx="18" fill="#ffffff"/>
<text x="225" y="38" text-anchor="middle" font-family="system-ui,sans-serif" font-size="24" font-weight="700" fill="#1b2430">安定平衡</text>
<text x="675" y="38" text-anchor="middle" font-family="system-ui,sans-serif" font-size="24" font-weight="700" fill="#1b2430">不安定平衡</text>
<path d="M70 120 Q225 330 380 120" fill="none" stroke="#5e6b78" stroke-width="8" stroke-linecap="round"/>
<circle cx="260" cy="272" r="24" fill="#79a8ff" stroke="#155eef" stroke-width="4"/>
<circle cx="225" cy="290" r="6" fill="#18794e"/>
<path d="M255 235 Q236 248 228 272" fill="none" stroke="#155eef" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="225" y="332" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" fill="#5e6b78">少しずれても元へ戻る</text>
<line x1="675" y1="286" x2="675" y2="92" stroke="#b8c0cc" stroke-width="3" stroke-dasharray="8 7"/>
<circle cx="675" cy="286" r="11" fill="#1b2430"/>
<line x1="675" y1="286" x2="718" y2="98" stroke="#155eef" stroke-width="10" stroke-linecap="round"/>
<circle cx="718" cy="98" r="24" fill="#79a8ff" stroke="#155eef" stroke-width="4"/>
<path d="M685 160 A92 92 0 0 1 720 170" fill="none" stroke="#c92a2a" stroke-width="4" stroke-linecap="round" marker-end="url(#dangerArrow)"/>
<path d="M675 137 A52 52 0 0 1 703 145" fill="none" stroke="#155eef" stroke-width="3"/>
<text x="704" y="134" font-family="system-ui,sans-serif" font-size="20" fill="#155eef">θ</text>
<text x="675" y="332" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" fill="#5e6b78">少し傾くと、さらに傾く</text>
<line x1="450" y1="55" x2="450" y2="330" stroke="#d9dee7" stroke-width="2"/>
</svg>