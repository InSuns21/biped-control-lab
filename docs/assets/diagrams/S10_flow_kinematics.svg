<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="610" viewBox="0 0 1000 610" role="img" aria-labelledby="title desc">
<title id="title">流れる水粒子が曲がったホースを進むときの横速度と横加速度</title>
<desc id="desc">水粒子がホースに沿って速度Uで進むため、固定位置でのホース運動と空間形状の両方を感じることを示す。物質微分D/Dt=partial_t+U partial_sと、その二乗からy_tt、2U y_st、U^2 y_ssが現れる。</desc>
<defs>
<marker id="blue" markerUnits="userSpaceOnUse" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#155eef"/></marker>
<marker id="green" markerUnits="userSpaceOnUse" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#18794e"/></marker>
<marker id="red" markerUnits="userSpaceOnUse" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#c92a2a"/></marker>
</defs>
<rect width="1000" height="610" rx="18" fill="#fff"/>
<text x="500" y="38" text-anchor="middle" font-family="system-ui,sans-serif" font-size="24" font-weight="700" fill="#1b2430">内部流の2項は「動く水粒子を追いかける」と自然に出る</text>

<rect x="45" y="75" width="910" height="245" rx="16" fill="#f7f8fb" stroke="#d9dee7" stroke-width="2"/>
<text x="70" y="108" font-family="system-ui,sans-serif" font-size="19" font-weight="700" fill="#1b2430">水粒子は、ホース上の同じ場所に留まらず s → s + UΔt へ進む</text>
<path d="M95 248 C190 246 236 176 330 168 C430 160 500 250 600 243 C694 236 748 155 905 178" fill="none" stroke="#155eef" stroke-width="7" stroke-linecap="round"/>
<circle cx="330" cy="168" r="10" fill="#c92a2a"/>
<circle cx="600" cy="243" r="10" fill="#c92a2a"/>
<text x="330" y="148" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" fill="#c92a2a">時刻 t</text>
<text x="600" y="281" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" fill="#c92a2a">時刻 t+Δt</text>
<path d="M355 155 C425 125 505 160 570 220" fill="none" stroke="#18794e" stroke-width="4" marker-end="url(#green)"/>
<text x="462" y="133" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" font-weight="700" fill="#18794e">ホースに沿って速さ U</text>
<line x1="330" y1="260" x2="330" y2="181" stroke="#c92a2a" stroke-width="3" marker-end="url(#red)"/>
<text x="345" y="225" font-family="system-ui,sans-serif" font-size="15" fill="#c92a2a">y(s,t)</text>
<line x1="95" y1="285" x2="905" y2="285" stroke="#9aa6b2" stroke-width="2" stroke-dasharray="7 7"/>
<text x="902" y="308" text-anchor="end" font-family="system-ui,sans-serif" font-size="14" fill="#5e6b78">基準軸 s</text>

<rect x="45" y="345" width="910" height="220" rx="16" fill="#f7f8fb" stroke="#d9dee7" stroke-width="2"/>
<text x="70" y="380" font-family="system-ui,sans-serif" font-size="19" font-weight="700" fill="#1b2430">粒子から見た変化率 = 時間変化 + 流れによる場所移動</text>
<text x="500" y="423" text-anchor="middle" font-family="system-ui,sans-serif" font-size="24" font-weight="700" fill="#155eef">D/Dt = ∂/∂t + U ∂/∂s</text>
<text x="500" y="459" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" fill="#1b2430">横速度：Dy/Dt = yₜ + U yₛ</text>
<text x="500" y="495" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" fill="#1b2430">横加速度：D²y/Dt² = yₜₜ + 2U yₛₜ + U² yₛₛ</text>
<text x="245" y="535" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" fill="#5e6b78">yₜₜ：固定位置そのものの横加速度</text>
<text x="505" y="535" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" fill="#18794e">2U yₛₜ：移動 × 形状変化の混合</text>
<text x="775" y="535" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" fill="#c92a2a">U² yₛₛ：曲がった経路を進む加速度</text>
</svg>