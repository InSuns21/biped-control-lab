<svg xmlns="http://www.w3.org/2000/svg" width="960" height="350" viewBox="0 0 960 350" role="img" aria-labelledby="title desc">
<title id="title">状態空間と状態フィードバック</title>
<desc id="desc">状態xが角度thetaと角速度theta dotからなり、ゲインKで制御入力u=-Kxを作り、線形系dot x=Ax+Buへ戻す構造を示す。</desc>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#155eef"/></marker></defs>
<rect width="960" height="350" rx="18" fill="#ffffff"/>
<text x="480" y="38" text-anchor="middle" font-family="system-ui,sans-serif" font-size="25" font-weight="700" fill="#1b2430">PD制御を「状態 x」から見る</text>
<rect x="65" y="90" width="225" height="120" rx="16" fill="#eef4ff" stroke="#79a8ff" stroke-width="3"/>
<text x="178" y="123" text-anchor="middle" font-family="system-ui,sans-serif" font-size="21" font-weight="700" fill="#1b2430">状態ベクトル</text>
<text x="178" y="165" text-anchor="middle" font-family="system-ui,sans-serif" font-size="25" fill="#155eef">x = [ θ, θ̇ ]ᵀ</text>
<text x="178" y="194" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" fill="#5e6b78">「今どうなっているか」</text>
<rect x="368" y="90" width="210" height="120" rx="16" fill="#f7f8fb" stroke="#155eef" stroke-width="3"/>
<text x="473" y="124" text-anchor="middle" font-family="system-ui,sans-serif" font-size="21" font-weight="700" fill="#1b2430">状態フィードバック</text>
<text x="473" y="165" text-anchor="middle" font-family="system-ui,sans-serif" font-size="25" fill="#155eef">u = −Kx</text>
<text x="473" y="194" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" fill="#5e6b78">K = [ k₁  k₂ ]</text>
<rect x="655" y="90" width="240" height="120" rx="16" fill="#f7f8fb" stroke="#5e6b78" stroke-width="3"/>
<text x="775" y="124" text-anchor="middle" font-family="system-ui,sans-serif" font-size="21" font-weight="700" fill="#1b2430">線形モデル</text>
<text x="775" y="165" text-anchor="middle" font-family="system-ui,sans-serif" font-size="25" fill="#1b2430">ẋ = Ax + Bu</text>
<text x="775" y="194" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" fill="#5e6b78">閉ループ：ẋ=(A−BK)x</text>
<line x1="290" y1="150" x2="357" y2="150" stroke="#155eef" stroke-width="4" marker-end="url(#a)"/>
<line x1="578" y1="150" x2="644" y2="150" stroke="#155eef" stroke-width="4" marker-end="url(#a)"/>
<path d="M775 211 V285 H178 V220" fill="none" stroke="#155eef" stroke-width="4" marker-end="url(#a)"/>
<text x="476" y="308" text-anchor="middle" font-family="system-ui,sans-serif" font-size="19" fill="#5e6b78">A−BK の固有値が、減衰の速さ・振動のしかたを決める</text>
</svg>