<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
<title id="title">LIPM・ZMP・capture pointとステップ</title>
<desc id="desc">重心COMが支持足の上方にあり前向き速度を持つ。足裏内のZMPだけで抑えられない場合、速度を含むcapture pointが前方へ出て、そこ付近へ次の足を置くことで回復する概念図。</desc>
<defs>
  <marker id="blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#155eef"/></marker>
  <marker id="red" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#c92a2a"/></marker>
</defs>
<rect width="960" height="420" rx="18" fill="#ffffff"/>
<text x="480" y="38" text-anchor="middle" font-family="system-ui,sans-serif" font-size="25" font-weight="700" fill="#1b2430">位置だけでなく「勢い」を見る：capture point</text>
<line x1="60" y1="340" x2="900" y2="340" stroke="#5e6b78" stroke-width="4"/>
<rect x="300" y="315" width="175" height="25" rx="10" fill="#eef4ff" stroke="#155eef" stroke-width="3"/>
<text x="388" y="375" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" fill="#5e6b78">現在の支持足</text>
<circle cx="395" cy="130" r="30" fill="#79a8ff" stroke="#155eef" stroke-width="4"/>
<text x="395" y="137" text-anchor="middle" font-family="system-ui,sans-serif" font-size="19" font-weight="700" fill="#1b2430">COM</text>
<line x1="395" y1="160" x2="395" y2="340" stroke="#155eef" stroke-width="3" stroke-dasharray="7 7"/>
<line x1="420" y1="105" x2="555" y2="105" stroke="#c92a2a" stroke-width="5" marker-end="url(#red)"/>
<text x="490" y="88" text-anchor="middle" font-family="system-ui,sans-serif" font-size="19" fill="#c92a2a">前向き速度 ẋ</text>
<circle cx="430" cy="327" r="11" fill="#18794e"/>
<text x="430" y="306" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" fill="#18794e">ZMP p</text>
<circle cx="650" cy="327" r="12" fill="#c92a2a"/>
<text x="650" y="304" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" font-weight="700" fill="#c92a2a">capture point ξ</text>
<text x="650" y="276" text-anchor="middle" font-family="system-ui,sans-serif" font-size="19" fill="#1b2430">ξ = x + ẋ/ω</text>
<rect x="610" y="315" width="175" height="25" rx="10" fill="#fff5f5" stroke="#c92a2a" stroke-width="3" stroke-dasharray="8 6"/>
<text x="698" y="375" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" fill="#c92a2a">次の足を置く候補</text>
<path d="M490 235 C545 205 610 205 660 238" fill="none" stroke="#155eef" stroke-width="4" marker-end="url(#blue)"/>
<text x="575" y="192" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" fill="#155eef">大きな外乱なら支持領域を前へ作り直す</text>
</svg>