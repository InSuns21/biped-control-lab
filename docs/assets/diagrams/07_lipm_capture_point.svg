<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title desc">
<title id="title">LIPM・ZMP・capture pointとステップ</title>
<desc id="desc">重心が前向き速度を持つとcapture pointは前方へ移る。現在の支持足内のZMPだけで抑えられない場合は、capture point付近へ次の足を置いて支持領域を作り直す。</desc>
<defs><marker id="blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#155eef"/></marker><marker id="red" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#c92a2a"/></marker></defs>
<rect width="960" height="440" rx="18" fill="#ffffff"/>
<text x="480" y="40" text-anchor="middle" font-family="system-ui,sans-serif" font-size="24" font-weight="700" fill="#1b2430">位置だけでなく「勢い」を見る：capture point</text>
<line x1="60" y1="358" x2="900" y2="358" stroke="#5e6b78" stroke-width="4"/>
<rect x="285" y="333" width="190" height="25" rx="10" fill="#eef4ff" stroke="#155eef" stroke-width="3"/>
<text x="380" y="395" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" fill="#5e6b78">現在の支持足</text>
<circle cx="390" cy="132" r="31" fill="#79a8ff" stroke="#155eef" stroke-width="4"/>
<text x="390" y="139" text-anchor="middle" font-family="system-ui,sans-serif" font-size="19" font-weight="700" fill="#1b2430">COM</text>
<line x1="390" y1="163" x2="390" y2="358" stroke="#155eef" stroke-width="3" stroke-dasharray="7 7"/>
<line x1="424" y1="108" x2="566" y2="108" stroke="#c92a2a" stroke-width="5" marker-end="url(#red)"/>
<text x="495" y="88" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" fill="#c92a2a">前向き速度 v</text>
<circle cx="430" cy="345" r="11" fill="#18794e"/>
<text x="430" y="321" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" fill="#18794e">ZMP p</text>
<circle cx="660" cy="345" r="12" fill="#c92a2a"/>
<text x="660" y="321" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" font-weight="700" fill="#c92a2a">capture point ξ</text>
<text x="660" y="290" text-anchor="middle" font-family="system-ui,sans-serif" font-size="19" fill="#1b2430">ξ = x + v/ω</text>
<rect x="610" y="333" width="195" height="25" rx="10" fill="#fff5f5" stroke="#c92a2a" stroke-width="3" stroke-dasharray="8 6"/>
<text x="708" y="395" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" fill="#c92a2a">次の足を置く候補</text>
<path d="M480 248 C545 210 615 210 675 250" fill="none" stroke="#155eef" stroke-width="4" marker-end="url(#blue)"/>
<text x="575" y="197" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" fill="#155eef">大きな外乱では支持領域を前へ作り直す</text>
<text x="575" y="222" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" fill="#5e6b78">v を含めて「どこへ足を置けば止められるか」を見る</text>
</svg>
