<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-labelledby="title desc">
<title id="title">倒立振子の誤差増幅</title>
<desc id="desc">小さな正の角度が正の角加速度を生み、角度がさらに増えていく正のフィードバック的な関係を矢印で示す。</desc>
<defs>
  <marker id="a" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" viewBox="0 0 12 12" refX="10" refY="6" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#c92a2a"/></marker>
</defs>
<rect width="900" height="300" rx="18" fill="#ffffff"/>
<text x="450" y="42" text-anchor="middle" font-family="system-ui,sans-serif" font-size="25" font-weight="700" fill="#1b2430">無制御では「ずれ」が自分で増える</text>
<rect x="60" y="105" width="190" height="88" rx="14" fill="#f7f8fb" stroke="#d9dee7" stroke-width="2"/>
<rect x="355" y="105" width="190" height="88" rx="14" fill="#fff5f5" stroke="#c92a2a" stroke-width="2"/>
<rect x="650" y="105" width="190" height="88" rx="14" fill="#fff5f5" stroke="#c92a2a" stroke-width="2"/>
<text x="155" y="139" text-anchor="middle" font-family="system-ui,sans-serif" font-size="21" fill="#1b2430">小さな傾き</text>
<text x="155" y="171" text-anchor="middle" font-family="system-ui,sans-serif" font-size="23" font-weight="700" fill="#155eef">θ &gt; 0</text>
<text x="450" y="139" text-anchor="middle" font-family="system-ui,sans-serif" font-size="21" fill="#1b2430">同じ向きの加速</text>
<text x="450" y="171" text-anchor="middle" font-family="system-ui,sans-serif" font-size="23" font-weight="700" fill="#c92a2a">θ¨ &gt; 0</text>
<text x="745" y="139" text-anchor="middle" font-family="system-ui,sans-serif" font-size="21" fill="#1b2430">さらに傾く</text>
<text x="745" y="171" text-anchor="middle" font-family="system-ui,sans-serif" font-size="23" font-weight="700" fill="#c92a2a">θ ↑</text>
<line x1="250" y1="149" x2="344" y2="149" stroke="#c92a2a" stroke-width="5" stroke-linecap="round" marker-end="url(#a)"/>
<line x1="545" y1="149" x2="639" y2="149" stroke="#c92a2a" stroke-width="5" stroke-linecap="round" marker-end="url(#a)"/>
<path d="M745 202 C745 260 155 260 155 204" fill="none" stroke="#c92a2a" stroke-width="4" stroke-dasharray="8 7" stroke-linecap="round" marker-end="url(#a)"/>
<text x="450" y="278" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" fill="#5e6b78">このループを断つのがフィードバック制御</text>
</svg>