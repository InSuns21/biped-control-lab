<svg xmlns="http://www.w3.org/2000/svg" width="960" height="330" viewBox="0 0 960 330" role="img" aria-labelledby="title desc">
<title id="title">PDフィードバック制御の閉ループ</title>
<desc id="desc">目標角度0と測定角度thetaの誤差をPD制御器へ入れ、制御トルクuで倒立振子を動かし、角度と角速度を再び測って戻す閉ループ。</desc>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#155eef"/></marker></defs>
<rect width="960" height="330" rx="18" fill="#ffffff"/>
<text x="480" y="38" text-anchor="middle" font-family="system-ui,sans-serif" font-size="25" font-weight="700" fill="#1b2430">PD制御は「測る → 戻す → また測る」の閉ループ</text>
<circle cx="185" cy="145" r="28" fill="#fff" stroke="#155eef" stroke-width="3"/>
<text x="185" y="153" text-anchor="middle" font-family="system-ui,sans-serif" font-size="28" fill="#155eef">Σ</text>
<text x="72" y="122" font-family="system-ui,sans-serif" font-size="19" fill="#1b2430">目標 θ*=0</text>
<line x1="90" y1="145" x2="154" y2="145" stroke="#155eef" stroke-width="4" marker-end="url(#a)"/>
<rect x="270" y="100" width="220" height="90" rx="14" fill="#f7f8fb" stroke="#155eef" stroke-width="3"/>
<text x="380" y="134" text-anchor="middle" font-family="system-ui,sans-serif" font-size="21" font-weight="700" fill="#1b2430">PD 制御器</text>
<text x="380" y="168" text-anchor="middle" font-family="system-ui,sans-serif" font-size="21" fill="#155eef">u = −Kp θ − Kd θ̇</text>
<line x1="214" y1="145" x2="259" y2="145" stroke="#155eef" stroke-width="4" marker-end="url(#a)"/>
<rect x="575" y="100" width="220" height="90" rx="14" fill="#f7f8fb" stroke="#5e6b78" stroke-width="3"/>
<text x="685" y="134" text-anchor="middle" font-family="system-ui,sans-serif" font-size="21" font-weight="700" fill="#1b2430">倒立振子</text>
<text x="685" y="168" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" fill="#5e6b78">重力 + 慣性 + 制御トルク</text>
<line x1="490" y1="145" x2="564" y2="145" stroke="#155eef" stroke-width="4" marker-end="url(#a)"/>
<text x="525" y="132" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" fill="#155eef">u</text>
<line x1="795" y1="145" x2="884" y2="145" stroke="#155eef" stroke-width="4" marker-end="url(#a)"/>
<text x="838" y="130" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" fill="#1b2430">θ, θ̇</text>
<path d="M865 160 V255 H185 V177" fill="none" stroke="#155eef" stroke-width="4" marker-end="url(#a)"/>
<rect x="523" y="226" width="210" height="58" rx="12" fill="#eef4ff" stroke="#79a8ff" stroke-width="2"/>
<text x="628" y="261" text-anchor="middle" font-family="system-ui,sans-serif" font-size="19" fill="#1b2430">センサで角度・角速度を測る</text>
<text x="201" y="229" font-family="system-ui,sans-serif" font-size="18" fill="#c92a2a">− フィードバック</text>
</svg>