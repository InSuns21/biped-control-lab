<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="720" viewBox="0 0 1100 720" role="img" aria-labelledby="t d">
<title id="t">Euler–Bernoulli 梁で4階微分が現れるまで</title>
<desc id="d">梁の変位、傾き、曲率と、微小区間の曲げモーメント、せん断力、分布荷重を対応付ける図。</desc>
<defs>
<marker id="a" markerUnits="userSpaceOnUse" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#155eef"/></marker>
<marker id="g" markerUnits="userSpaceOnUse" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#18794e"/></marker>
<marker id="r" markerUnits="userSpaceOnUse" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#c92a2a"/></marker>
</defs>
<rect width="1100" height="720" rx="18" fill="#fff"/>

<text x="550" y="42" text-anchor="middle" font-family="system-ui,sans-serif" font-size="25" font-weight="700" fill="#1b2430">Euler–Bernoulli 梁：曲げ復元が4階微分になるまで</text>

<!-- left panel -->
<rect x="35" y="75" width="500" height="340" rx="16" fill="#f7f8fb" stroke="#d9dee7" stroke-width="2"/>
<text x="60" y="112" font-family="system-ui,sans-serif" font-size="20" font-weight="700" fill="#1b2430">形状側：変位 → 傾き → 曲率</text>

<text x="80" y="155" font-family="system-ui,sans-serif" font-size="16" fill="#1b2430">傾きが場所で変わる</text>
<text x="80" y="184" font-family="system-ui,sans-serif" font-size="18" font-weight="700" fill="#155eef">曲率 κ ≈ yₛₛ</text>

<line x1="85" y1="325" x2="485" y2="325" stroke="#98a2ad" stroke-width="2" stroke-dasharray="6 6"/>
<text x="480" y="350" text-anchor="end" font-family="system-ui,sans-serif" font-size="14" fill="#5e6b78">基準直線 y = 0</text>

<path d="M85 325 C165 321 215 272 280 220 C348 166 415 169 485 213" fill="none" stroke="#155eef" stroke-width="6" stroke-linecap="round"/>
<circle cx="280" cy="220" r="7" fill="#155eef"/>

<line x1="280" y1="220" x2="368" y2="178" stroke="#18794e" stroke-width="4" marker-end="url(#g)"/>
<text x="382" y="182" font-family="system-ui,sans-serif" font-size="16" font-weight="700" fill="#18794e">θ ≈ yₛ</text>

<line x1="280" y1="325" x2="280" y2="227" stroke="#c92a2a" stroke-width="3" stroke-dasharray="5 5" marker-end="url(#r)"/>
<text x="296" y="278" font-family="system-ui,sans-serif" font-size="16" fill="#c92a2a">y(s)</text>

<text x="85" y="390" font-family="system-ui,sans-serif" font-size="14" fill="#5e6b78">yₛ：傾き　　yₛₛ：曲がり具合</text>

<!-- right panel -->
<rect x="565" y="75" width="500" height="340" rx="16" fill="#f7f8fb" stroke="#d9dee7" stroke-width="2"/>
<text x="590" y="112" font-family="system-ui,sans-serif" font-size="20" font-weight="700" fill="#1b2430">力学側：モーメント → せん断力 → 分布荷重</text>

<text x="815" y="155" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" font-weight="700" fill="#c92a2a">分布荷重 q_load(s)</text>
<g stroke="#c92a2a" stroke-width="3" marker-end="url(#r)">
<line x1="735" y1="172" x2="735" y2="215"/>
<line x1="785" y1="172" x2="785" y2="215"/>
<line x1="835" y1="172" x2="835" y2="215"/>
<line x1="885" y1="172" x2="885" y2="215"/>
</g>

<rect x="720" y="225" width="190" height="64" rx="9" fill="#eef4ff" stroke="#155eef" stroke-width="3"/>
<text x="815" y="251" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" font-weight="700" fill="#1b2430">短い梁区間</text>
<text x="815" y="275" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#5e6b78">[s, s + Δs]</text>

<line x1="685" y1="302" x2="685" y2="237" stroke="#18794e" stroke-width="4" marker-end="url(#g)"/>
<text x="650" y="270" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" fill="#18794e">V(s)</text>

<line x1="945" y1="234" x2="945" y2="299" stroke="#18794e" stroke-width="4" marker-end="url(#g)"/>
<text x="997" y="270" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" fill="#18794e">V(s+Δs)</text>

<path d="M700 330 C652 320 638 284 660 255" fill="none" stroke="#155eef" stroke-width="4" marker-end="url(#a)"/>
<text x="628" y="354" font-family="system-ui,sans-serif" font-size="15" fill="#155eef">M_b(s)</text>

<path d="M930 330 C978 320 992 284 970 255" fill="none" stroke="#155eef" stroke-width="4" marker-end="url(#a)"/>
<text x="918" y="354" font-family="system-ui,sans-serif" font-size="15" fill="#155eef">M_b(s+Δs)</text>

<text x="815" y="390" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#1b2430">M_b の場所変化が V、V の場所変化が q_load を生む</text>

<!-- bottom flow -->
<text x="42" y="463" font-family="system-ui,sans-serif" font-size="20" font-weight="700" fill="#1b2430">微分を一本道でたどる</text>

<g font-family="system-ui,sans-serif">
<rect x="35" y="490" width="135" height="90" rx="12" fill="#eef4ff" stroke="#155eef" stroke-width="2"/>
<text x="102" y="524" text-anchor="middle" font-size="20" font-weight="700" fill="#155eef">y</text>
<text x="102" y="553" text-anchor="middle" font-size="15" fill="#1b2430">変位</text>

<rect x="190" y="490" width="135" height="90" rx="12" fill="#f3fbf7" stroke="#18794e" stroke-width="2"/>
<text x="257" y="524" text-anchor="middle" font-size="20" font-weight="700" fill="#18794e">yₛ</text>
<text x="257" y="553" text-anchor="middle" font-size="15" fill="#1b2430">傾き</text>

<rect x="345" y="490" width="145" height="90" rx="12" fill="#fff8ea" stroke="#b78103" stroke-width="2"/>
<text x="417" y="524" text-anchor="middle" font-size="19" font-weight="700" fill="#9a6700">yₛₛ ≈ κ</text>
<text x="417" y="553" text-anchor="middle" font-size="15" fill="#1b2430">曲率</text>

<rect x="510" y="490" width="165" height="90" rx="12" fill="#eef4ff" stroke="#155eef" stroke-width="2"/>
<text x="592" y="524" text-anchor="middle" font-size="17" font-weight="700" fill="#155eef">M_b ≈ EI yₛₛ</text>
<text x="592" y="553" text-anchor="middle" font-size="15" fill="#1b2430">曲げモーメント</text>

<rect x="695" y="490" width="165" height="90" rx="12" fill="#f3fbf7" stroke="#18794e" stroke-width="2"/>
<text x="777" y="524" text-anchor="middle" font-size="17" font-weight="700" fill="#18794e">V ~ ∂M_b/∂s</text>
<text x="777" y="553" text-anchor="middle" font-size="15" fill="#1b2430">せん断力</text>

<rect x="880" y="490" width="185" height="90" rx="12" fill="#fff1f1" stroke="#c92a2a" stroke-width="2"/>
<text x="972" y="524" text-anchor="middle" font-size="17" font-weight="700" fill="#c92a2a">q_load ~ EI yₛₛₛₛ</text>
<text x="972" y="553" text-anchor="middle" font-size="15" fill="#1b2430">分布力</text>
</g>

<g stroke="#5e6b78" stroke-width="3" marker-end="url(#a)">
<line x1="170" y1="535" x2="185" y2="535"/>
<line x1="325" y1="535" x2="340" y2="535"/>
<line x1="490" y1="535" x2="505" y2="535"/>
<line x1="675" y1="535" x2="690" y2="535"/>
<line x1="860" y1="535" x2="875" y2="535"/>
</g>

<rect x="85" y="615" width="930" height="70" rx="14" fill="#f7f8fb" stroke="#d9dee7" stroke-width="2"/>
<text x="550" y="644" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" font-weight="700" fill="#1b2430">曲率 yₛₛ は「曲がり具合」。各微小区間に働く横力まで求めるには、さらに2回空間微分する。</text>
<text x="550" y="669" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" fill="#5e6b78">そのため曲げ復元項は EI yₛₛₛₛ になる。</text>
</svg>