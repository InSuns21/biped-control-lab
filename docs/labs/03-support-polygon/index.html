<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Lab 3 支持多角形 | Biped Control Lab</title><link rel="stylesheet" href="../../css/site.css"></head>
<body><main class="lab-shell"><a class="back-link" href="../../#06">← 理論: 支持多角形とZMPへ</a><h1>Lab 3 — 支持多角形と重心投影</h1><p class="lead">上から見た足裏とCOM投影点です。赤い点をドラッグして、両足支持と片足支持を比較してください。</p>
<div class="lab-layout"><section><canvas id="sim" width="760" height="540"></canvas></section><aside class="controls">
<div class="control"><label for="mode">接触状態</label><select id="mode"><option value="both">両足支持</option><option value="left">左足のみ</option><option value="right">右足のみ</option></select></div>
<div class="button-row"><button id="center">COMを中央へ</button></div>
<div class="metrics"><div class="metric"><span>COM x</span><strong id="xMetric">-</strong></div><div class="metric"><span>COM y</span><strong id="yMetric">-</strong></div><div class="metric"><span>支持状態</span><strong id="modeMetric">-</strong></div><div class="metric"><span>静的判定</span><strong id="statusMetric">-</strong></div></div>
</aside></div><section class="panel"><h2>注意</h2><p>これは静的判定です。歩行中は速度・加速度があるので、COM投影だけでなくZMPなどの動力学的条件が必要です。</p></section><script type="module" src="./sim.js"></script></main></body></html>
