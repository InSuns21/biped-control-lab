<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Lab 4 LIPM歩行 | Biped Control Lab</title><link rel="stylesheet" href="../../css/site.css"></head>
<body><main class="lab-shell"><a class="back-link" href="../../#07">← 理論: LIPMへ</a><h1>Lab 4 — LIPM歩行・ZMP・ステップ回復</h1><p class="lead">周期歩行と立位外乱回復を切り替え、COM、ZMP、capture point を同時に観察します。</p>
<div class="lab-layout"><section><canvas id="sim" width="820" height="500"></canvas></section><aside class="controls">
<div class="control"><label for="mode">実験モード</label><select id="mode"><option value="walk">周期歩行</option><option value="recovery">立位・外乱回復</option></select></div>
<div class="control"><label for="height">重心高さ h <output id="heightOut"></output></label><input id="height" type="range" min="0.55" max="1.2" value="0.85" step="0.05"></div>
<div class="control"><label for="stepLimit">歩幅 / 最大回復歩幅 <output id="stepOut"></output></label><input id="stepLimit" type="range" min="0.15" max="0.65" value="0.36" step="0.01"></div>
<div class="control"><label for="stepTime">1歩の時間 T <output id="timeOut"></output></label><input id="stepTime" type="range" min="0.45" max="1.10" value="0.75" step="0.05"></div>
<div class="control"><label for="autoStep">外乱時のステップ回復</label><select id="autoStep"><option value="on">ON</option><option value="off">OFF</option></select></div>
<div class="button-row"><button id="push">前へ押す</button><button id="pushBack">後ろへ押す</button><button id="reset">リセット</button></div>
<div class="metrics"><div class="metric"><span>COM x</span><strong id="comMetric">-</strong></div><div class="metric"><span>ZMP p</span><strong id="zmpMetric">-</strong></div><div class="metric"><span>Capture point ξ</span><strong id="cpMetric">-</strong></div><div class="metric"><span>歩数</span><strong id="stepMetric">-</strong></div></div>
</aside></div><section class="panel"><h2>2つの見方</h2><p><strong>周期歩行</strong>では、LIPM の厳密解を使い、重心が支持足の後方から前方へ移るたび次の足へ支持点を切り替えます。<strong>立位・外乱回復</strong>では、ZMPを足裏内で動かして姿勢を戻し、capture point が支持領域を超えると一歩踏み出します。</p></section><script type="module" src="./sim.js"></script></main></body></html>
